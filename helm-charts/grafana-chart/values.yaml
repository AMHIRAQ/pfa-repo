replicaCount: 1

image:
  repository: grafana/grafana
  tag: "10.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  size: 5Gi

adminUser: admin
adminPassword: admin123

datasources:
  prometheus:
    url: http://prometheus:9090
    access: proxy
    isDefault: true
  loki:
    url: http://loki:3100
    access: proxy
