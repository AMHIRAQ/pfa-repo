---
#=======================================================
# STEP 1: Install Container Runtime (containerd)
#=======================================================
- name: Install and configure containerd
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Install containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Generate default containerd configuration
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

#=======================================================
# STEP 2: Configure System Prerequisites & Security Hardening
#=======================================================
- name: Configure system for Kubernetes with security hardening
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Add entries to /etc/hosts for all nodes
      lineinfile:
        path: /etc/hosts
        line: '{{ hostvars[item].ansible_host }} {{ item }}'
        state: present
      loop: "{{ groups['k8s_cluster'] }}"

    - name: Disable Swap
      command: swapoff -a

    - name: Keep swap disabled after reboot
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf

    - name: Load modules immediately
      modprobe:
        name: '{{ item }}'
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl for Kubernetes
      copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/k8s.conf

    - name: Apply sysctl settings
      command: sysctl --system

#=======================================================
# STEP 3: Install Kubernetes Components
#=======================================================
- name: Install Kubernetes packages
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        state: present
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      apt_repository:
        repo: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /'
        state: present
        filename: kubernetes

    - name: Install Kubernetes packages
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: '{{ item }}'
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

#=======================================================
# STEP 4: Initialize Kubernetes Master (Control Plane)
# — single master —
#=======================================================
- name: Initialize Kubernetes Control Plane
  hosts: master          # groupe "master" = un seul nœud
  become: yes
  tasks:
    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_init_stat

    # Calico utilise le CIDR 192.168.0.0/16 par défaut
    # (flannel utilisait 10.244.0.0/16)
    - name: Initialize Kubernetes cluster with Calico CIDR
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      register: kubeadm_output
      when: not k8s_init_stat.stat.exists
      failed_when: kubeadm_output.rc != 0

    - name: Display kubeadm init output
      debug:
        msg: '{{ kubeadm_output.stdout_lines }}'
      when: not k8s_init_stat.stat.exists and kubeadm_output is defined

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        owner: root
        group: root
        mode: '0644'
        remote_src: yes

    # Copie aussi pour l'utilisateur ubuntu (connexion Ansible)
    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to ubuntu user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        remote_src: yes

    - name: Wait for kube-apiserver to be ready
      wait_for:
        host: '{{ ansible_default_ipv4.address }}'
        port: 6443
        delay: 10
        timeout: 300

    #---------------------------------------------------
    #---------------------------------------------------
    # Flannel CNI (Simple, Stable, Automatisé)
    #---------------------------------------------------
    - name: Install Flannel CNI
      command: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 3
      delay: 15
      register: flannel_result
      until: flannel_result.rc == 0

    - name: Wait for Flannel pods to be ready
      shell: |
        kubectl get pods -n kube-flannel --no-headers 2>/dev/null | grep -c Running
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_pods_running
      until: flannel_pods_running.stdout | int >= 1
      retries: 30
      delay: 10
      ignore_errors: yes

    #---------------------------------------------------
    # Token de join pour les workers
    #---------------------------------------------------
    - name: Generate join command with 24h TTL
      command: kubeadm token create --print-join-command --ttl 24h
      register: join_command

    - name: Save join command to file
      copy:
        content: '{{ join_command.stdout }}'
        dest: /tmp/k8s_join_command.sh
        mode: '0755'

    - name: Display join command
      debug:
        msg: '{{ join_command.stdout }}'

#=======================================================
# STEP 5: Join Worker Nodes to Cluster
#=======================================================
- name: Join worker nodes to cluster
  hosts: workers
  become: yes
  tasks:
    - name: Check if node is already in cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Reset kubeadm if node not in cluster
      command: kubeadm reset -f
      when: not kubelet_conf.stat.exists
      ignore_errors: yes

    - name: Clean up old Kubernetes files
      file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/kubernetes/
        - /var/lib/kubelet/
        - /var/lib/etcd/
      when: not kubelet_conf.stat.exists
      ignore_errors: yes

    - name: Copy join command from master
      slurp:
        src: /tmp/k8s_join_command.sh
      register: join_command_content
      delegate_to: '{{ groups.master[0] }}' 
    - name: Join worker to cluster
      shell: '{{ join_command_content.content | b64decode }} --node-name {{ inventory_hostname }}'
      when: not kubelet_conf.stat.exists
      register: join_result
      failed_when: join_result.rc != 0

    - name: Display join result
      debug:
        msg: '{{ join_result.stdout_lines }}'
      when: not kubelet_conf.stat.exists and join_result is defined

    - name: Wait for kubelet to start
      systemd:
        name: kubelet
        state: started
      when: not kubelet_conf.stat.exists

#=======================================================
# STEP 6: Install Helm on the master
#=======================================================
- name: Install Helm
  hosts: master
  become: yes
  tasks:
    - name: Check if Helm is already installed
      command: helm version --short
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Download Helm installation script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: '0700'
      when: helm_check.rc != 0

    - name: Run Helm installation script
      command: /tmp/get-helm-3.sh
      when: helm_check.rc != 0
      register: helm_install_result

    - name: Display Helm installation result
      debug:
        msg: '{{ helm_install_result.stdout_lines }}'
      when: helm_check.rc != 0 and helm_install_result is defined

    - name: Verify Helm installation
      command: helm version --short
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: helm_version

    - name: Display Helm version
      debug:
        msg: 'Helm installé : {{ helm_version.stdout }}'

#=======================================================
# STEP 7: Install ArgoCD via Helm
#=======================================================
- name: Install ArgoCD
  hosts: master
  become: yes
  tasks:
    - name: Create argocd namespace
      command: kubectl create namespace argocd
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ignore_errors: yes

    - name: Add ArgoCD Helm repository
      shell: |
        helm repo add argo https://argoproj.github.io/argo-helm
        helm repo update
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Install ArgoCD
      shell: |
        helm install argocd argo/argo-cd \
          -n argocd \
          --set server.service.type=LoadBalancer \
          --set dex.enabled=false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: argocd_install_result
      failed_when: argocd_install_result.rc != 0 and "already exists" not in argocd_install_result.stderr

    - name: Wait for ArgoCD server to be ready
      shell: |
        kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-server --no-headers 2>/dev/null | grep Running | wc -l
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: argocd_server_ready
      until: argocd_server_ready.stdout | int >= 1
      retries: 30
      delay: 10

    - name: Display ArgoCD installation result
      debug:
        msg: 'ArgoCD installed successfully'
#=======================================================
# STEP 8: Install Kyverno via Helm
#=======================================================
- name: Install Kyverno
  hosts: master
  become: yes
  tasks:
    - name: Create kyverno namespace
      command: kubectl create namespace kyverno
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ignore_errors: yes

    - name: Add Kyverno Helm repository
      shell: |
        helm repo add kyverno https://kyverno.github.io/kyverno/
        helm repo update
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Install Kyverno
      shell: |
        helm install kyverno kyverno/kyverno \
          -n kyverno \
          --create-namespace
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kyverno_install_result
      failed_when: kyverno_install_result.rc != 0 and "already exists" not in kyverno_install_result.stderr

    - name: Wait for Kyverno pods to be ready
      shell: |
        kubectl get pods -n kyverno --no-headers 2>/dev/null | grep Running | wc -l
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kyverno_ready
      until: kyverno_ready.stdout | int >= 3
      retries: 30
      delay: 10
      ignore_errors: yes

    - name: Display Kyverno pods status
      shell: |
        kubectl get pods -n kyverno -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kyverno_pods

    - name: Display Kyverno pods
      debug:
        msg: '{{ kyverno_pods.stdout_lines }}'

    - name: Display Kyverno installation result
      debug:
        msg: 'Kyverno installed successfully'
#=======================================================
# STEP 9: Verify Cluster Status
#=======================================================
- name: Verify cluster setup
  hosts: master
  become: yes
  tasks:
    - name: Wait for all nodes to be ready
      shell: kubectl get nodes --no-headers | awk '{print $2}' | grep -v '^Ready$' | wc -l
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: not_ready_nodes
      until: not_ready_nodes.stdout == '0'
      retries: 30
      delay: 10

    - name: Get cluster nodes
      command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_nodes

    - name: Display cluster nodes
      debug:
        msg: '{{ cluster_nodes.stdout_lines }}'

    - name: Get system pods status
      command: kubectl get pods --all-namespaces
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: all_pods

    - name: Display all pods
      debug:
        msg: '{{ all_pods.stdout_lines }}'

    - name: Get services
      command: kubectl get svc
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: services

    - name: Display services
      debug:
        msg: '{{ services.stdout_lines }}'

    - name: Get cluster info
      command: kubectl cluster-info
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_info

    - name: Display cluster info
      debug:
        msg: '{{ cluster_info.stdout_lines }}'

    - name: Final cluster status
      debug:
        msg:
          - '=== Kubernetes Cluster Setup Complete ==='
          - 'Master  : 1 nœud (single control plane)'
          - 'Workers : {{ groups.workers | length }} nœud(s)'
          - 'CNI     : Flannel (CIDR 10.244.0.0/16)'
          - 'Helm    : installé sur le master'
          - 'Tous les nœuds sont Ready'
