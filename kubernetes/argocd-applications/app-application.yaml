apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TON-USERNAME/pfa-repo
    targetRevision: main
    path: helm-charts/app-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true