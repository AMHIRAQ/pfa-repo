apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-psa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AMHIRAQ/pfa-repo.git
    targetRevision: main
    path: kubernetes/psa
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

