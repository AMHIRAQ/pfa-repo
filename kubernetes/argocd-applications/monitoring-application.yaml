apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AMHIRAQ/pfa-repo.git
    targetRevision: main
    path: helm-charts/prometheus-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

